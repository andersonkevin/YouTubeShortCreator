<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; object-src 'none'">
<title>YouTubeShortCreator Visual Library</title>
<style>/*STYLES*/
.transport button img{width:18px;height:18px;filter:invert(1)}
#detail{white-space:pre-line}
.recipe .badge{position:absolute;right:1px;bottom:1px;width:18px;height:18px;border-radius:50%;border:1px solid #101214;display:grid;place-items:center}
.recipe .badge img{width:12px;height:12px;filter:none}
.recipe.lime .badge{background:#def0a2}.recipe.cyan .badge{background:#ade8ed}.recipe.rose .badge{background:#f2b9c9}
</style>
</head>
<body>
<header><strong>YouTubeShortCreator <span>VISUAL LIBRARY</span></strong><span class="status">ASSET REVIEW</span></header>
<main>
<aside><h2>Chart studies</h2><nav id="studies" aria-label="Chart studies"></nav><h2>Icon collection</h2><div id="icons"></div></aside>
<section class="stage">
<div class="viewport"><article id="frame">
<div class="progress"><i id="progress"></i></div>
<div class="brand">VISUAL LIBRARY <span>/ STUDY</span></div>
<p id="eyebrow"></p><h1 id="title"></h1>
<div id="chart" role="img"></div>
<p id="detail"></p><p id="insight"></p>
<footer><strong id="source-kind"></strong><span id="source"></span><span id="reference"></span></footer>
</article></div>
<div class="transport"><button id="play" type="button" aria-label="Play preview" title="Play preview"></button><label for="time">Time</label><input id="time" type="range" min="0" max="8" step="0.1" value="4"><output id="time-label" for="time">4.0 s</output></div>
</section>
</main>
<script>/*ECHARTS*/</script><script>/*LIBRARY_DATA*/</script><script>/*OPTIONS*/</script><script>/*RENDERER*/</script>
</body></html>
